[project]
name = "yunxiao-projex-mcp"
version = "0.1.3"
description = "MCP server for Alibaba Cloud Yunxiao Projex project management"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = [
    "mcp",
    "model-context-protocol",
    "aliyun",
    "yunxiao",
    "projex",
    "project-management",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "alibabacloud-devops20210625>=5.0.3,<6",
    "httpx>=0.28,<1",
    "mcp>=1.28,<2",
    "pydantic>=2.11,<3",
    "python-dotenv>=1.0",
]

[project.urls]
Homepage = "https://github.com/MrLinWang/yunxiao-projex-mcp"
Repository = "https://github.com/MrLinWang/yunxiao-projex-mcp"
Issues = "https://github.com/MrLinWang/yunxiao-projex-mcp/issues"

[project.optional-dependencies]
dev = [
    "anyio>=4.5",
    "pytest>=8",
]

[project.scripts]
yunxiao-projex-mcp = "yunxiao_projex_mcp.server:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: tests that call the real Yunxiao API",
    "live_write: tests that create and delete real Yunxiao data",
]
